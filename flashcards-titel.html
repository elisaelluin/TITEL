<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards – Nouveaux produits 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Couleurs : à ajuster ici si besoin ---------- */
  .fc-wrap {
    --fc-bg: #f4f5f9;        /* fond de la zone */
    --fc-card: #ffffff;      /* recto */
    --fc-back: #1f2a44;      /* verso */
    --fc-title: #1f2a44;     /* texte recto */
    --fc-hint: #6b7a99;      /* "Cliquer pour découvrir" */
    --fc-back-text: #ffffff; /* texte verso */
    --fc-accent: #8fb4ff;    /* mot rappelé au verso */
  }

  html, body { margin: 0; padding: 0; background: #f4f5f9; }

  .fc-wrap {
    box-sizing: border-box;
    background: var(--fc-bg);
    padding: 32px 16px;
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .fc-wrap *, .fc-wrap *::before, .fc-wrap *::after { box-sizing: border-box; }

  .fc-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    max-width: 960px;
    margin: 0 auto;
  }
  @media (max-width: 760px) { .fc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .fc-grid { grid-template-columns: 1fr; gap: 16px; } }

  /* La carte est un vrai bouton : cliquable, accessible au clavier */
  .fc-card {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    font: inherit;
    color: inherit;
    text-align: center;
    cursor: pointer;
    perspective: 1200px;
    -webkit-tap-highlight-color: transparent;
  }
  .fc-card:focus-visible { outline: 3px solid #5b8def; outline-offset: 4px; border-radius: 18px; }

  /* Recto et verso empilés dans la même cellule : la carte prend la hauteur du plus grand */
  .fc-inner {
    display: grid;
    min-height: 220px;
    transition: transform .55s cubic-bezier(.2,.7,.2,1);
    transform-style: preserve-3d;
  }
  .fc-card[aria-pressed="true"] .fc-inner { transform: rotateY(180deg); }

  .fc-face {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px 22px;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(31, 42, 68, .08);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .fc-front { background: var(--fc-card); transition: box-shadow .2s ease, transform .2s ease; }
  .fc-card:hover .fc-front { box-shadow: 0 10px 28px rgba(31, 42, 68, .14); }

  .fc-back {
    background: var(--fc-back);
    color: var(--fc-back-text);
    transform: rotateY(180deg);
  }

  .fc-emoji { font-size: 38px; line-height: 1; margin-bottom: 6px; }
  .fc-word  { font-size: 20px; font-weight: 500; line-height: 1.35; color: var(--fc-title); text-wrap: balance; }
  .fc-hint  { font-size: 14px; color: var(--fc-hint); }

  .fc-back-word { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fc-accent); }
  .fc-def       { font-size: 15px; line-height: 1.5; text-wrap: pretty; }

  @media (prefers-reduced-motion: reduce) {
    .fc-inner { transition: none; }
  }
</style>
</head>
<body>

<div class="fc-wrap">
  <div class="fc-grid" id="fc-grid"></div>
</div>

<script>
  /* =====================================================================
     CONTENU DES CARTES — c'est la seule partie à modifier.
     emoji : l'icône au recto
     mot   : le mot affiché au recto
     def   : l'explication affichée au verso
     Ajoutez ou supprimez des lignes librement (3, 6 ou 9 cartes rendent le mieux).
     ===================================================================== */
  var CARTES = [
    { emoji: "💧", mot: "Hydrofuge",
      def: "Traitement qui empêche l'eau de pénétrer dans un support (tuile, façade, pierre) tout en le laissant respirer. L'eau perle en surface." },
    { emoji: "🛢️", mot: "Oléofuge",
      def: "Traitement qui repousse les graisses et les huiles. Il limite les taches sur les sols, terrasses et dallages." },
    { emoji: "🧱", mot: "Remontées capillaires",
      def: "Humidité du sol qui monte dans les murs. Elle se traite en injectant une résine qui forme une barrière étanche à la base du mur." },
    { emoji: "🖌️", mot: "Primaire d'accrochage",
      def: "Première couche appliquée sur le support. Elle garantit l'adhérence et la tenue dans le temps du revêtement final." },
    { emoji: "🌿", mot: "COV",
      def: "Composés organiques volatils : des substances qui s'évaporent à température ambiante. Moins un produit en contient, meilleur il est pour l'air intérieur et l'applicateur." },
    { emoji: "🧪", mot: "Résine époxy",
      def: "Résine à deux composants (résine + durcisseur). Très résistante à l'abrasion et aux produits chimiques : idéale pour les sols de garages et d'ateliers." }
  ];

  var TEXTE_INDICE = "Cliquer pour découvrir";

  /* ---------- Construction des cartes (ne pas modifier) ---------- */
  (function () {
    var grille = document.getElementById("fc-grid");

    function el(tag, classe, texte) {
      var n = document.createElement(tag);
      if (classe) n.className = classe;
      if (texte) n.textContent = texte;
      return n;
    }

    CARTES.forEach(function (c) {
      var carte = el("button", "fc-card");
      carte.type = "button";
      carte.setAttribute("aria-pressed", "false");

      var inner = el("span", "fc-inner");

      var recto = el("span", "fc-face fc-front");
      var emoji = el("span", "fc-emoji", c.emoji);
      emoji.setAttribute("aria-hidden", "true");
      recto.appendChild(emoji);
      recto.appendChild(el("span", "fc-word", c.mot));
      recto.appendChild(el("span", "fc-hint", TEXTE_INDICE));

      var verso = el("span", "fc-face fc-back");
      verso.appendChild(el("span", "fc-back-word", c.mot));
      verso.appendChild(el("span", "fc-def", c.def));
      verso.setAttribute("aria-hidden", "true");

      inner.appendChild(recto);
      inner.appendChild(verso);
      carte.appendChild(inner);

      carte.addEventListener("click", function () {
        var retournee = carte.getAttribute("aria-pressed") === "true";
        carte.setAttribute("aria-pressed", retournee ? "false" : "true");
        recto.setAttribute("aria-hidden", retournee ? "false" : "true");
        verso.setAttribute("aria-hidden", retournee ? "true" : "false");
      });

      grille.appendChild(carte);
    });
  })();
</script>

</body>
</html>
